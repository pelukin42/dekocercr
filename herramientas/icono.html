<!doctype html>
<!-- Ícono para celular (180x180). Se exporta con:
     msedge --headless=new --screenshot=icono.png --window-size=180,180 --hide-scrollbars herramientas/icono.html -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html,body{ margin:0; width:180px; height:180px; overflow:hidden; }
  body{ display:grid; place-items:center; background:#2B231E; }
  svg{ width:104px; height:104px; color:#D9C7B3; }
</style>
</head>
<body>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
    <rect x="2.5" y="2.5" width="8.5" height="8.5" rx="1.2"/>
    <rect x="13" y="2.5" width="8.5" height="8.5" rx="1.2"/>
    <rect x="2.5" y="13" width="8.5" height="8.5" rx="1.2"/>
    <rect x="13" y="13" width="8.5" height="8.5" rx="1.2" fill="currentColor" stroke="none"/>
  </svg>
</body>
</html>

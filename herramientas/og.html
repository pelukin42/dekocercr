<!doctype html>
<!-- Imagen para compartir (1200x630). Se exporta con:
     msedge --headless=new --screenshot=og.png --window-size=1200,630 --hide-scrollbars herramientas/og.html
     y se convierte a pro/img/og.jpg. -->
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; width:1200px; height:630px; overflow:hidden; }
  body{ display:grid; grid-template-columns:600px 600px; font-family:"Mulish","Segoe UI",sans-serif; background:#2B231E; color:#F5F1EC; }
  .txt{ position:relative; display:flex; flex-direction:column; justify-content:center; padding:0 56px;
        background:radial-gradient(90% 80% at 0% 100%, rgba(124,108,93,.55), transparent 70%), #2B231E; }
  .marca{ font-family:"Jost",sans-serif; font-weight:300; font-size:82px; letter-spacing:.16em; line-height:1; margin:0; }
  .marca i{ font-style:normal; display:inline-block; transform:scaleX(-1); }
  .sub{ font-size:16px; font-weight:600; letter-spacing:.3em; text-transform:uppercase; color:#C0AB95; margin:18px 0 34px; }
  .lema{ font-family:"Jost",sans-serif; font-weight:400; font-size:38px; line-height:1.2; margin:0 0 22px; }
  .lugar{ font-size:20px; color:#D8CCBE; margin:0; }
  .franja{ display:flex; gap:10px; margin-top:30px; }
  .franja span{ font-size:14px; letter-spacing:.06em; border:1px solid rgba(245,241,236,.35); border-radius:999px; padding:7px 14px; }
  .foto{ background:url("../pro/img/ambientes/hero.jpg") center/cover no-repeat; position:relative; }
  .foto::before{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, #2B231E 0%, rgba(43,35,30,0) 26%); }
</style>
</head>
<body>
  <div class="txt">
    <p class="marca">DEKOC<i>E</i>R</p>
    <p class="sub">Pisos y azulejos</p>
    <p class="lema">Renová tus espacios con estilo y ahorro</p>
    <p class="lugar">Porcelanato · Cerámica · Fachaletas · Heredia</p>
    <div class="franja"><span>Hecho en Brasil</span><span>Hecho en España</span><span>Precio publicado</span></div>
  </div>
  <div class="foto"></div>
</body>
</html>
